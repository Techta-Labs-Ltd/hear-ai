[project]
name = "hear-ai-execution-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "cryptography>=50,<51",
    "fastapi>=0.141,<1",
    "httpx>=0.27,<0.28",
    "huggingface-hub>=0.24,<1",
    "numpy>=1.24.3,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "scipy>=1.11,<1.17",
    "soundfile>=0.12,<1",
]

[dependency-groups]
pod = [
    "aio-pika>=9.5,<10",
    "uvicorn>=0.34,<1",
]
serverless = [
    "runpod>=1.12,<2",
]
transcription = [
    "qwen-asr>=0.0.6",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "transformers>=4.48,<5",
    "whisperx @ git+https://github.com/Ahelsamahy/whisperX.git@68a6634d1b9dfbc3ec4ca3ba800d998fc682b56b",
]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
override-dependencies = [
    "numpy>=1.24.3,<2",
    "packaging>=24.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
triton = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true