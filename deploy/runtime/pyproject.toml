[project]
name = "hear-ai-execution-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "cryptography>=50,<51",
    "fastapi>=0.141,<1",
    "httpx>=0.27,<0.28",
    "numpy>=1.24.3,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "scipy>=1.11,<1.17",
    "soundfile>=0.12,<1",
]

[dependency-groups]
pod = [
    "aio-pika>=9.5,<10",
    "uvicorn>=0.34,<1",
]
serverless = [
    "runpod>=1.12,<2",
]
transcription = [
    "accelerate>=0.34,<2",
    "qwen-asr>=0.0.6",
    "silero-vad==6.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
    "whisperx @ git+https://github.com/Ahelsamahy/whisperX.git@68a6634d1b9dfbc3ec4ca3ba800d998fc682b56b",
]
pipeline = [
    "accelerate>=0.34,<2",
    "qwen-asr>=0.0.6",
    "silero-vad==6.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
    "whisperx @ git+https://github.com/Ahelsamahy/whisperX.git@68a6634d1b9dfbc3ec4ca3ba800d998fc682b56b",
]
pipeline-llm = [
    "vllm>=0.11,<1",
]
reconstruction = [
    "absl-py",
    "argbind",
    "cachetools",
    "datasets==2.18.0",
    "descript-audio-codec",
    "descript-audiotools",
    "docstring-parser",
    "einx[torch]==0.2.2",
    "ffmpy",
    "flatten-dict",
    "hydra-core>=1.3.2",
    "importlib-resources",
    "ipython",
    "julius",
    "kui>=1.6.0",
    "librosa>=0.10.1,<1",
    "lightning>=2.1.0",
    "lightning-utilities",
    "loguru>=0.6.0",
    "loralib>=0.1.2",
    "markdown2",
    "modelscope==1.17.1",
    "natsort>=8.4.0",
    "onnxruntime>=1.20,<2",
    "opencc-python-reimplemented==0.1.7",
    "ormsgpack",
    "pyaudio",
    "pydub",
    "pyloudnorm>=0.1.1,<1",
    "pyrootutils>=1.0.4",
    "pystoi",
    "randomname",
    "resampy>=0.4.3",
    "rich>=13.5.3",
    "safetensors",
    "silero-vad",
    "tensorboard>=2.14.1",
    "tensorboard-data-server",
    "tiktoken>=0.8.0",
    "torch==2.8.0",
    "torch-stoi",
    "torchaudio==2.8.0",
    "torchmetrics",
    "transformers<=4.57.3",
    "wandb>=0.19.0",
    "werkzeug",
    "zstandard>=0.22.0",
]
magic-clean-natural = [
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
dev = [
    "huggingface-hub>=0.24,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{ group = "transcription" }, { group = "reconstruction" }],
    [{ group = "pipeline" }, { group = "reconstruction" }],
    [{ group = "pipeline-llm" }, { group = "reconstruction" }],
    [{ group = "transcription" }, { group = "magic-clean-natural" }],
    [{ group = "pipeline" }, { group = "magic-clean-natural" }],
    [{ group = "reconstruction" }, { group = "magic-clean-natural" }],
]
override-dependencies = [
    "numpy>=1.24.3,<2",
    "packaging>=24.2",
    "protobuf>=6.31.1,<7",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
triton = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.ruff.lint]
ignore = ["E501"]
