listeners.tcp.default = 127.0.0.1:5672
loopback_users.guest = true
vm_memory_high_watermark.absolute = 1GB
disk_free_limit.absolute = 8GB
# Whole-recording inference acknowledges only after the persisted outcome.
# Keep a finite three-hour ceiling rather than RabbitMQ's 30-minute default.
consumer_timeout = 10800000
