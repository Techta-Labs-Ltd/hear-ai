[supervisord]
nodaemon=true
loglevel=info
user=root

[unix_http_server]
file=/tmp/hear-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/hear-supervisor.sock

[program:postgres]
directory=/workspace/hear-ai
command=/bin/bash /workspace/hear-ai/scripts/start-postgres.sh
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=5

[program:ray-head]
directory=/workspace/hear-ai
command=/bin/bash -lc 'exec uv run --no-project ray start --head --block --dashboard-host=0.0.0.0 --dashboard-port=8282'
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
priority=10

[program:hear-ray-server]
directory=/workspace/hear-ai
command=/bin/bash /workspace/hear-ai/scripts/start-hear-ray-server.sh
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",RAY_ADDRESS="auto"
priority=20
