[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-ai"
version = "5.0.0"
description = "Unified Hear audio intelligence and resolver service on Ray Serve"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ray[serve,train]>=2.56,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "protobuf>=6.31.1,<7",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "httpx>=0.27,<0.28",
    "sentry-sdk>=2.14,<3",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "transformers>=4.48,<5",
    "accelerate>=0.26",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3,<4",
    "sentencepiece>=0.2,<0.3",
    "spacy>=3.8,<4",
    "whisperx @ git+https://github.com/Ahelsamahy/whisperX.git@qwenasr-and-Forced-aligner",
    "qwen-asr>=0.0.6",
    "rapidfuzz>=3.9,<4",
    "numpy>=1.24.3,<2",
    "soundfile>=0.12,<1",
    "scipy>=1.11,<1.17",
    "librosa>=0.10",
    "omegaconf>=2.3",
    "clearvoice>=0.1.2",
    "demucs>=4,<5",
    "pyloudnorm>=0.1.1",
    "silero-vad>=5.1.2",
    "boto3>=1.35,<2",
    "cryptography>=43,<50",
    "openai>=1,<2",
]

[project.scripts]
hear-server = "main:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.74,<1.76",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hear*"]

[tool.uv]
package = true
# WhisperX's declared NumPy floor is stricter than its runtime usage and
# conflicts with ClearVoice's supported NumPy range. The deployed stack is
# validated on NumPy 1.x, so keep one explicit, reproducible constraint.
override-dependencies = [
    "numpy>=1.24.3,<2",
    "packaging>=24.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
triton = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "hear/resolver/tests"]
pythonpath = ["."]
norecursedirs = ["integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["hear"]
ignore_missing_imports = true
