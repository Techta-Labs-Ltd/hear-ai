[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-ai"
version = "5.0.0"
description = "Hear audio intelligence execution runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<0.28",
    "sentry-sdk>=2.14,<3",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "transformers>=4.48,<5",
    "accelerate>=0.26",
    "sentencepiece>=0.2,<0.3",
    "whisperx @ git+https://github.com/Ahelsamahy/whisperX.git@68a6634d1b9dfbc3ec4ca3ba800d998fc682b56b",
    "qwen-asr>=0.0.6",
    "numpy>=1.24.3,<2",
    "soundfile>=0.12,<1",
    "scipy>=1.11,<1.17",
    "librosa>=0.10",
    "huggingface-hub>=0.24,<1",
    "hf-transfer>=0.1,<1",
    "pyloudnorm>=0.1.1",
    "silero-vad>=5.1.2",
    "boto3>=1.35,<2",
    "cryptography>=50,<51",
]

[dependency-groups]
dev = [
    "einx==0.2.2",
    "mypy>=1.14,<2",
    "onnxruntime>=1.20,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

cleaner = [
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["hear*"]

[tool.uv]
package = true
# WhisperX's declared NumPy floor is stricter than its runtime usage and
# conflicts with ClearVoice's supported NumPy range. The deployed stack is
# validated on NumPy 1.x, so keep one explicit, reproducible constraint.
override-dependencies = [
    "numpy>=1.24.3,<2",
    "packaging>=24.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
triton = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["hear"]
ignore_missing_imports = true
