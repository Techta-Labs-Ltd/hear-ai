name: Publish HEAR AI production container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: hear-ai-production-container-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bazel
        run: |
          curl -fLsS https://github.com/bazelbuild/bazel/releases/download/8.4.2/bazel-8.4.2-linux-x86_64 -o /tmp/hear-bazel
          printf '%s  %s\n' 4dc8e99dfa802e252dac176d08201fd15c542ae78c448c8a89974b6f387c282c /tmp/hear-bazel | sha256sum -c -
          chmod 0755 /tmp/hear-bazel
      - name: Verify the current hear-ai candidate
        run: |
          python -m pip install requests
          python scripts/verify_published_image.py --write /tmp/hear-ai-before.json
      - name: Publish through Bazel using hear-ai package permissions
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          source_image="$(python -c "import json; print(json.load(open('/tmp/hear-ai-before.json'))['image'])")"
          /tmp/hear-bazel run //:publish_existing_runpod_image -- --source-image "$source_image" --tag ghcr.io/techta-labs-ltd/hear-ai:cutover-7ef75975d2ad
      - name: Verify unchanged runtime and correct repository association
        run: python scripts/verify_published_image.py --compare /tmp/hear-ai-before.json --write hear-ai-publication-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: hear-ai-publication-receipt
          path: hear-ai-publication-receipt.json
          retention-days: 7
