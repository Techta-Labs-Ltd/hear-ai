name: Architecture and patch checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 pydantic==2.11.7 fastapi==0.116.1 httpx==0.27.2 pyyaml==6.0.2 huggingface-hub==0.34.4
      - run: python -m hear.tools.check_architecture
      - run: python -m pytest tests/test_architecture.py tests/test_dependency_patches.py tests/test_runtime_setup.py tests/test_four_job_contracts.py tests/test_new_fastapi_health.py tests/test_model_asset_manifest.py -q
