name: Fleet health
# Every 30 minutes: compare the live RunPod endpoints with the committed plans and
# fail loudly (GitHub notifies the repository owners) when workers cannot run.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      repair:
        description: Restore each endpoint's plan worker cap and GPU exclusions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hear-ai-fleet-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RUNPOD_DEPLOY_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      HEAR_POD_GATEWAY_URL: ${{ vars.HEAR_POD_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<0.28' 'pydantic>=2.9,<3' 'python-dotenv>=1.0,<2'
      - name: Compare the fleet with the deploy plans
        run: |
          test -n "$RUNPOD_DEPLOY_API_KEY" || { echo 'RUNPOD_API_KEY secret missing'; exit 1; }
          PYTHONPATH=. python scripts/fleet_health.py --plans-dir deploy/runpod --min-balance 25 \
            ${{ inputs.repair && '--repair' || '' }} --output fleet-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-health
          path: fleet-health.json
          retention-days: 14
