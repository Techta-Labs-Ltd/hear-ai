name: Runtime quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.9
      - run: uv sync --project deploy/runtime --locked --group pod --group serverless --group dev
      - run: uv pip install --python deploy/runtime/.venv/bin/python --no-cache --index-strategy unsafe-best-match --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu' 'torchaudio==2.8.0+cpu' 'onnxruntime==1.30.0' 'librosa==0.11.0' 'pyloudnorm==0.2.0' 'protobuf==6.33.6'
      - run: uv run --project deploy/runtime ruff check hear tests scripts
      - run: uv run --project deploy/runtime mypy
      - run: uv run --project deploy/runtime python -m hear.tools.check_architecture
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsox-dev
      - run: uv run --project deploy/runtime python -m pytest tests tests/integration -q
  image-inputs:
    # The ten-image matrix below takes 10 to 50 minutes per image and saturates the
    # runner pool for hours. Build it only when the image inputs changed, or on demand.
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            images:
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/runtime/**'
              - 'deploy/cleaner/**'
              - 'patches/**'
              - 'hear/model_manifest.json'
              - 'scripts/package_image_context.py'
              - 'scripts/run_serverless.sh'
              - 'scripts/run_pod_stack.sh'
  docker-images:
    needs: [quality, image-inputs]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.image-inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - pipeline-pod
          - pipeline-serverless
          - pipeline-llm-pod
          - pipeline-llm-serverless
          - transcription-pod
          - transcription-serverless
          - reconstruction-pod
          - reconstruction-serverless
          - magic-clean-natural-pod
          - magic-clean-natural-serverless
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for the model-bearing images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
